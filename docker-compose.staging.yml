services:
  api:
    image: ghcr.io/${OWNER:?OWNER is required}/${REPOSITORY:?REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${PROJECT_NAME:?PROJECT_NAME is not set in .env file}

    ports:
      - '127.0.0.1:3000:3000'

    env_file:
      - .env

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  database:
    image: postgres:18-alpine

    container_name: ${DB_NAME:?DB_NAME is not set in .env file}

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env file}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set in .env file}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
  coturn:
    image: coturn/coturn:4.18.0-r0
    container_name: coturn-staging
    network_mode: host
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --external-ip=${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}
      - --realm=${TURN_HOST:?TURN_HOST is required}
    volumes:
      - ./infrastructure/coturn/turnserver.staging.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres-data:
