name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: staging
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}:staging

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/messinger-backend

            export OWNER="${{ env.OWNER }}"
            export REPOSITORY="${{ env.REPOSITORY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"

            docker compose -f docker-compose.staging.yml pull api

            docker compose -f docker-compose.staging.yml up -d database

            docker compose -f docker-compose.staging.yml run --rm api pnpm cli migration run

            docker compose -f docker-compose.staging.yml run --rm api pnpm cli seed

            docker compose -f docker-compose.staging.yml up -d api
