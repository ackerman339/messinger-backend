services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ${PROJECT_NAME:?PROJECT_NAME is not set in .env file}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      LIVEKIT_API_URL: '${LIVEKIT_API_URL:-http://livekit:7880}'
      LIVEKIT_WS_URL: '${LIVEKIT_WS_URL:-ws://${LIVEKIT_LOCAL_IP:-127.0.0.1}:7880}'
      LIVEKIT_API_KEY: '${LIVEKIT_API_KEY:-devkey}'
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET:-secret}'
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    container_name: ${DB_NAME:?DB_NAME is not set in .env file}
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env file}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set in .env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  database_test:
    image: postgres:18-alpine
    container_name: ${DB_TEST_NAME:?DB_TEST_NAME is not set in .env file}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_TEST_NAME:?DB_TEST_NAME is not set in .env file}
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_TEST_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.18.0-r0
    container_name: coturn
    restart: unless-stopped
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ['--dev', '--bind', '0.0.0.0']
    ports:
      - '${LIVEKIT_LOCAL_IP:-127.0.0.1}:7880:7880/tcp'
      - '${LIVEKIT_LOCAL_IP:-127.0.0.1}:7881:7881/tcp'
      - '${LIVEKIT_LOCAL_IP:-127.0.0.1}:7882:7882/udp'
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: "${LIVEKIT_LOCAL_IP:-127.0.0.1}"
          stun_servers:
            - "${LIVEKIT_LOCAL_IP:-127.0.0.1}:3478"
          turn_servers:
            - host: "${LIVEKIT_LOCAL_IP:-127.0.0.1}"
              port: 3478
              protocol: udp
              secret: "${TURN_SECRET:?TURN_SECRET is required}"
            - host: "${LIVEKIT_LOCAL_IP:-127.0.0.1}"
              port: 3478
              protocol: tcp
              secret: "${TURN_SECRET:?TURN_SECRET is required}"
        room:
          auto_create: false
        keys:
          "${LIVEKIT_API_KEY:-devkey}": "${LIVEKIT_API_SECRET:-secret}"
        webhook:
          api_key: "${LIVEKIT_API_KEY:-devkey}"
          urls:
            - "http://api:${PORT:-3000}${API_PREFIX-/api}/V1/group-calls/livekit-webhook"

volumes:
  postgres-data:
  postgres-test-data:
  node_modules:
