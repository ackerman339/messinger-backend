# Network
listening-port=3478
listening-ip=0.0.0.0

min-port=49160
max-port=49200

# Authentication
# Secret, realm and public IP are supplied through Compose.
use-auth-secret

# Security
fingerprint
no-multicast-peers

# TLS is disabled until certificates are configured.
no-tls

# Logging
log-file=stdout
simple-log

# Nonce
stale-nonce=600